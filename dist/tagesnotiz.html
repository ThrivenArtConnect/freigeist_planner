<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Tages-Notiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0e0d;--surface:#161514;--surface-2:#1d1c1a;
  --border:rgba(255,255,255,0.08);--text:#e8e6e3;
  --text-muted:#7a7876;--text-faint:#3f3e3c;
  --accent:#4f98a3;--accent-glow:rgba(79,152,163,0.18);
  --radius:12px;--font:"Inter",sans-serif;
  --transition:180ms cubic-bezier(0.16,1,0.3,1);
}
html{-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
body{font-family:var(--font);font-size:16px;background:var(--bg);color:var(--text);min-height:100dvh;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:100;background:rgba(15,14,13,0.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 1rem;height:56px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:15px;font-weight:600;letter-spacing:-0.02em;color:var(--text);display:flex;align-items:center;gap:8px}
.logo svg{color:var(--accent)}
.date-nav{display:flex;align-items:center;gap:6px}
.date-nav button{background:none;border:none;color:var(--text-muted);cursor:pointer;padding:6px;border-radius:6px;transition:color var(--transition),background var(--transition);display:flex;align-items:center}
.date-nav button:hover{color:var(--text);background:var(--surface-2)}
.date-nav button:active{background:rgba(255,255,255,0.08)}
#date-display{font-size:14px;font-weight:500;color:var(--text);min-width:120px;text-align:center;cursor:pointer;padding:4px 8px;border-radius:6px;transition:background var(--transition)}
#date-display:hover{background:var(--surface-2)}
main{flex:1;max-width:680px;width:100%;margin:0 auto;padding:24px 16px 120px;display:flex;flex-direction:column;gap:16px}
.day-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.day-card-header{padding:12px 16px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.day-label{font-size:13px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:var(--accent)}
.char-count{font-size:12px;color:var(--text-faint);font-variant-numeric:tabular-nums;transition:color var(--transition)}
.char-count.active{color:var(--text-muted)}
textarea{width:100%;background:transparent;border:none;outline:none;color:var(--text);font:inherit;font-size:15px;line-height:1.7;resize:none;padding:14px 16px 16px;min-height:160px;caret-color:var(--accent)}
textarea::placeholder{color:var(--text-faint)}
.save-status{padding:6px 16px 10px;font-size:12px;color:var(--text-faint);display:flex;align-items:center;gap:5px;min-height:30px}
.save-dot{width:6px;height:6px;border-radius:50%;background:var(--text-faint);transition:background var(--transition)}
.save-dot.saved{background:#6daa45}
.save-dot.unsaved{background:#e8af34}
.captures-section{display:flex;flex-direction:column;gap:8px}
.captures-title{font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-faint);padding:0 2px;display:flex;align-items:center;justify-content:space-between}
.capture-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.capture-time{font-size:11px;color:var(--text-faint);font-variant-numeric:tabular-nums;white-space:nowrap;margin-top:2px;min-width:42px}
.capture-text{font-size:14px;color:var(--text-muted);line-height:1.5;flex:1;white-space:pre-wrap;word-break:break-word}
.capture-del{background:none;border:none;color:var(--text-faint);cursor:pointer;padding:2px;border-radius:4px;opacity:0;transition:opacity var(--transition),color var(--transition);font-size:16px;line-height:1}
.capture-item:hover .capture-del{opacity:1}
.capture-del:hover{color:#dd6974}
.fab{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);right:24px;z-index:200;width:56px;height:56px;border-radius:50%;background:var(--accent);border:none;color:#fff;cursor:pointer;box-shadow:0 4px 20px rgba(79,152,163,.45),0 2px 6px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;transition:transform var(--transition),box-shadow var(--transition)}
.fab:hover{transform:scale(1.07);box-shadow:0 6px 28px rgba(79,152,163,.6),0 2px 8px rgba(0,0,0,.4)}
.fab:active{transform:scale(.94)}
.fab svg{transition:transform var(--transition)}
.fab.open svg{transform:rotate(45deg)}
.qc-backdrop{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;padding:0 0 calc(env(safe-area-inset-bottom,0px) + 96px);opacity:0;pointer-events:none;transition:opacity .22s ease}
.qc-backdrop.visible{opacity:1;pointer-events:all}
.qc-sheet{background:var(--surface-2);border:1px solid var(--border);border-radius:16px;width:100%;max-width:640px;margin:0 16px;padding:16px;box-shadow:0 24px 48px rgba(0,0,0,.5);transform:translateY(12px);transition:transform .22s cubic-bezier(.16,1,.3,1)}
.qc-backdrop.visible .qc-sheet{transform:translateY(0)}
.qc-header{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.qc-textarea{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;outline:none;color:var(--text);font:inherit;font-size:15px;line-height:1.6;resize:none;padding:12px 14px;caret-color:var(--accent);transition:border-color var(--transition),box-shadow var(--transition);min-height:80px}
.qc-textarea:focus{border-color:rgba(79,152,163,.5);box-shadow:0 0 0 3px var(--accent-glow)}
.qc-actions{display:flex;gap:8px;margin-top:10px;justify-content:flex-end}
.btn{font:inherit;font-size:14px;font-weight:500;padding:8px 18px;border-radius:8px;border:none;cursor:pointer;transition:background var(--transition),transform var(--transition)}
.btn:active{transform:scale(.96)}
.btn-ghost{background:transparent;color:var(--text-muted)}
.btn-ghost:hover{background:var(--surface);color:var(--text)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#3b8490}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.today-badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--accent-glow);color:var(--accent);border:1px solid rgba(79,152,163,.25);border-radius:4px;padding:2px 6px;margin-left:6px;vertical-align:middle}
.empty-captures{font-size:13px;color:var(--text-faint);text-align:center;padding:20px 0 8px}
</style>
</head>
<body>
<header>
  <div class="logo">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
      <polyline points="14 2 14 8 20 8"/>
      <line x1="16" y1="13" x2="8" y2="13"/>
      <line x1="16" y1="17" x2="8" y2="17"/>
      <line x1="10" y1="9" x2="8" y2="9"/>
    </svg>
    Tages-Notiz
  </div>
  <div class="date-nav">
    <button id="prev-day" aria-label="Vorheriger Tag">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <span id="date-display" title="Klick = Heute"></span>
    <button id="next-day" aria-label="Naechster Tag">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>
</header>

<main>
  <div class="day-card">
    <div class="day-card-header">
      <div>
        <span class="day-label" id="card-day-label"></span>
        <span id="today-badge-slot"></span>
      </div>
      <span class="char-count" id="char-count">0 Z.</span>
    </div>
    <textarea id="day-note" placeholder="Notiz fuer diesen Tag..." autocomplete="off" spellcheck="true"></textarea>
    <div class="save-status">
      <div class="save-dot" id="save-dot"></div>
      <span id="save-label">-</span>
    </div>
  </div>
  <div class="captures-section">
    <div class="captures-title">
      <span>Quick Captures</span>
      <span id="capture-count"></span>
    </div>
    <div id="captures-list"></div>
  </div>
</main>

<button class="fab" id="fab" aria-label="Quick Capture oeffnen">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
  </svg>
</button>

<div class="qc-backdrop" id="qc-backdrop">
  <div class="qc-sheet" role="dialog" aria-modal="true">
    <div class="qc-header">
      <span>Quick Capture</span>
      <span id="qc-time"></span>
    </div>
    <textarea class="qc-textarea" id="qc-input" placeholder="Gedanke, Aufgabe, Idee..." rows="3"></textarea>
    <div class="qc-actions">
      <button class="btn btn-ghost" id="qc-cancel">Abbrechen</button>
      <button class="btn btn-primary" id="qc-save" disabled>Speichern</button>
    </div>
  </div>
</div>

<script>
const STORE_KEY = 'tagesnot_v1';
let currentDate = todayStr();
let saveTimer = null;

function todayStr(){return new Date().toISOString().slice(0,10)}
function loadStore(){try{return JSON.parse(localStorage.getItem(STORE_KEY))||{}}catch{return{}}}
function saveStore(s){try{localStorage.setItem(STORE_KEY,JSON.stringify(s))}catch{}}
function getDay(d){const s=loadStore();return s[d]||{note:'',captures:[]}}
function setDay(d,data){const s=loadStore();s[d]=data;saveStore(s)}

const DAYS=['So','Mo','Di','Mi','Do','Fr','Sa'];
const DAYS_FULL=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const MONTHS=['Jan','Feb','Mar','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];

function parseDate(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function formatDate(s){const d=parseDate(s);return DAYS[d.getDay()]+', '+d.getDate()+'. '+MONTHS[d.getMonth()]}
function fullDay(s){return DAYS_FULL[parseDate(s).getDay()]}
function offsetDate(s,n){const d=parseDate(s);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function fmtTime(iso){const d=new Date(iso);return d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function render(){
  const isToday=currentDate===todayStr();
  const data=getDay(currentDate);
  document.getElementById('date-display').textContent=formatDate(currentDate);
  const nextBtn=document.getElementById('next-day');
  nextBtn.style.opacity=isToday?'0.3':'1';
  nextBtn.disabled=isToday;
  document.getElementById('card-day-label').textContent=fullDay(currentDate);
  document.getElementById('today-badge-slot').innerHTML=isToday?'<span class="today-badge">Heute</span>':'';
  const ta=document.getElementById('day-note');
  ta.value=data.note;
  updateCharCount(data.note);
  setSaveStatus('saved',isToday?'Gespeichert':'Gespeichert ('+fullDay(currentDate)+')');
  renderCaptures(data.captures||[]);
}

function updateCharCount(v){
  const el=document.getElementById('char-count');
  el.textContent=v.length+' Z.';
  el.className='char-count'+(v.length>0?' active':'');
}
function setSaveStatus(state,label){
  document.getElementById('save-dot').className='save-dot '+state;
  document.getElementById('save-label').textContent=label;
}
function renderCaptures(caps){
  const list=document.getElementById('captures-list');
  const cnt=document.getElementById('capture-count');
  if(!caps.length){list.innerHTML='<div class="empty-captures">Noch keine Captures heute.</div>';cnt.textContent='';return}
  cnt.textContent=caps.length;
  list.innerHTML=caps.map((c,i)=>`<div class="capture-item"><span class="capture-time">${fmtTime(c.ts)}</span><span class="capture-text">${escHtml(c.text)}</span><button class="capture-del" data-i="${i}" aria-label="Loeschen">&#215;</button></div>`).join('');
  list.querySelectorAll('.capture-del').forEach(b=>b.addEventListener('click',e=>{
    const idx=+e.currentTarget.dataset.i;
    const data=getDay(currentDate);
    data.captures.splice(idx,1);
    setDay(currentDate,data);
    renderCaptures(data.captures);
  }));
}

document.getElementById('day-note').addEventListener('input',e=>{
  updateCharCount(e.target.value);
  setSaveStatus('unsaved','Nicht gespeichert...');
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    const data=getDay(currentDate);
    data.note=e.target.value;
    setDay(currentDate,data);
    setSaveStatus('saved','Gespeichert ✓');
  },800);
});
document.getElementById('prev-day').addEventListener('click',()=>{currentDate=offsetDate(currentDate,-1);render()});
document.getElementById('next-day').addEventListener('click',()=>{if(currentDate<todayStr()){currentDate=offsetDate(currentDate,1);render()}});
document.getElementById('date-display').addEventListener('click',()=>{currentDate=todayStr();render()});

const fab=document.getElementById('fab');
const backdrop=document.getElementById('qc-backdrop');
const qcInput=document.getElementById('qc-input');
const qcSave=document.getElementById('qc-save');

function openQC(){
  backdrop.classList.add('visible');
  fab.classList.add('open');
  document.getElementById('qc-time').textContent=new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
  setTimeout(()=>qcInput.focus(),80);
}
function closeQC(){
  backdrop.classList.remove('visible');
  fab.classList.remove('open');
  qcInput.value='';
  qcSave.disabled=true;
}
fab.addEventListener('click',()=>backdrop.classList.contains('visible')?closeQC():openQC());
document.getElementById('qc-cancel').addEventListener('click',closeQC);
backdrop.addEventListener('click',e=>{if(e.target===backdrop)closeQC()});
qcInput.addEventListener('input',()=>qcSave.disabled=!qcInput.value.trim());
qcInput.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter')saveCapture();
  if(e.key==='Escape')closeQC();
});
qcSave.addEventListener('click',saveCapture);

function saveCapture(){
  const text=qcInput.value.trim();
  if(!text)return;
  const today=todayStr();
  const data=getDay(today);
  if(!data.captures)data.captures=[];
  data.captures.unshift({text,ts:new Date().toISOString()});
  setDay(today,data);
  qcSave.textContent='✓ Gespeichert';
  setTimeout(()=>{qcSave.textContent='Speichern';closeQC();if(currentDate===today)renderCaptures(getDay(today).captures)},400);
}

render();
</script>
</body>
</html>
